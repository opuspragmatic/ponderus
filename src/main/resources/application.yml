spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ponderus-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql:///${DB_NAME:ponderus}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:ponderus}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ponderus}}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Le schema est piloté par Flyway, pas par Hibernate : "validate" verifie
    # que les entites correspondent au schema, sans jamais le modifier lui-meme.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/ponderus
          jwk-set-uri: https://www.googleapis.com/robot/v1/metadata/jwk/securetoken@system.gserviceaccount.com
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health, info
