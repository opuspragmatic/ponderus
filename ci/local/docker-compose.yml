name: ponderus-infra
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ponderus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ponderus}"
      POSTGRES_DB: "${POSTGRES_DB:-ponderus}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ponderus_net

  pgadmin:
    image: dpage/pgadmin4:7
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8081:80"
    networks:
      - ponderus_net
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:

networks:
  ponderus_net:

